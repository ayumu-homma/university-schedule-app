name: university_schedule_mobile
description: Flutter mobile MVP for the university shared schedule app.
publish_to: none
version: 1.1.0+2

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  app_links: ^7.2.1
  shared_domain:
    path: ../../packages/shared_domain
  drift: ^2.22.1
  sqlite3: 3.3.4
  path: ^1.9.0
  path_provider: ^2.1.5
  supabase_flutter: ^2.16.0
  http: ^1.6.0
  connectivity_plus: ^7.2.0
  url_launcher: ^6.3.2
  crypto: ^3.0.6
  intl: ^0.20.1
  timezone: ^0.10.1
  uuid: ^4.5.1
  file_picker: 10.3.10
  flutter_secure_storage: ^10.3.1
  mobile_scanner: 7.4.2
  qr_flutter: 4.1.0
  firebase_core: 4.15.0
  firebase_messaging: 16.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.13
  drift_dev: ^2.22.1
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
