      .h { font-size: 30px; font-weight: 700; }
      .sub { font-size: 20px; font-weight: 600; }
      .body { font-size: 18px; }
      .small { font-size: 15px; }
      .tiny { font-size: 12px; }
      .label { font-size: 15px; font-weight: 700; letter-spacing: 1px; }
      .muted { fill: #536171; }
      .white { fill: #fff; }
      .blue { fill: #175cd3; }
      .green { fill: #067647; }
      .orange { fill: #b54708; }
      .red { fill: #b42318; }
      .purple { fill: #6941c6; }
      .line { stroke: #d0d5dd; stroke-width: 2; }
