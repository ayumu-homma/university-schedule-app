<svg xmlns="http://www.w3.org/2000/svg" width="2880" height="1360" viewBox="0 0 2880 1360" role="img" aria-labelledby="title desc">
  <title id="title">UniSchedule v1.1 synthetic before and proposed wireframes</title>
  <desc id="desc">Editable generic wireframes for Today, Timetable, and Assignments/Exams. Before panels are schematic source-level representations. Proposal panels show research-informed 2D UX concepts.</desc>
  <defs>
