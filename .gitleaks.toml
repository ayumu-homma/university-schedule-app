title = "Uni Schedule secret scan: default rules plus reviewed noncredential literals"

[extend]
useDefault = true

# Each exception requires BOTH the exact file and exact source line.
# No real credentials or JWTs are allowlisted; all default detection rules remain enabled.

[[allowlists]]
targetRules = ["generic-api-key"]
condition = "AND"
description = "Persistent permission state key name; not a credential"
paths = ['''(^|/)apps/mobile/lib/features/notification/data/local_notification_store\.dart$''']
regexTarget = "line"
regexes = ['''^\s*static const legacyOrdinaryPermissionPromptKey = 'ordinary_permission_v1';\s*$''']

[[allowlists]]
targetRules = ["generic-api-key"]
condition = "AND"
description = "Synthetic local storage-scope activation marker; not an Auth bearer or provider token"
paths = ['''(^|/)apps/mobile/test/p132_friend_default_internal_api_test\.dart$''']
regexTarget = "line"
regexes = ['''^\s*activationToken: 'p132-synthetic-scope',\s*$''']

